name: 버그 리포트
description: 재현 가능한 게임 또는 개발 환경 문제를 기록합니다.
title: 'fix: '
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제
      description: 무엇이 잘못되었나요?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1. Chapter 1을 시작한다
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 환경
      placeholder: '배포 URL 또는 브라우저/OS'
    validations:
      required: true
